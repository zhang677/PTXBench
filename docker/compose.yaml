name: ptxbench

services:
  fibserve:
    container_name: ${PROFILE_CONTAINER:-ptxbench-fibserve}
    build:
      context: ..
      dockerfile: docker/Dockerfile.fibserve
    image: ptxbench/fibserve:dev
    environment:
      BASE_PORT: ${FIB_BACKEND_BASE_PORT:-40001}
      BENCH_ROOT: /workspace/PTXBench/packages/fibserve
      CONFIG_PATH: /workspace/PTXBench/packages/fibserve/acc_config.yaml
      DATASET_ROOTS: /workspace/accrl-training:/workspace/accrl-training-heavy
      DEVICES: ${FIB_DEVICES:-cuda:0,cuda:1}
      DISPATCH_PORT: "10000"
      HOST: 0.0.0.0
      TIMEOUT: ${FIB_TIMEOUT:-30}
      TMUX_PREFIX: fib-serve
      TVM_FFI_CUDA_ARCH_LIST: ${TVM_FFI_CUDA_ARCH_LIST:-9.0a}
    ports:
      - "${FIBSERVE_PORT:-10000}:10000"
    volumes:
      - ${PTXBENCH_TRACESET_ROOT:?Set PTXBENCH_TRACESET_ROOT to a FlashInfer Trace dataset}:/workspace/accrl-training:ro
      - ${PTXBENCH_HEAVY_TRACESET_ROOT:?Set PTXBENCH_HEAVY_TRACESET_ROOT to the heavy FlashInfer Trace dataset}:/workspace/accrl-training-heavy:ro
      - ../.ptxbench/cache/fibserve:/root/.cache/flashinfer_bench
    gpus:
      - driver: nvidia
        device_ids:
          - ${FIB_GPU_0:-0}
          - ${FIB_GPU_1:-1}
        capabilities:
          - gpu
    init: true
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import json, urllib.request;
          data=json.load(urllib.request.urlopen("http://localhost:10000/health", timeout=5));
          assert data["status"] == "ok" and data["backends"] and all(item["healthy"] for item in data["backends"])
      interval: 10s
      timeout: 5s
      retries: 30

  agent:
    build:
      context: ..
      dockerfile: docker/Dockerfile.agent
    image: ptxbench/mini-ptx-agent:dev
    network_mode: host
    working_dir: ${PTXBENCH_HOST_ROOT:?Set PTXBENCH_HOST_ROOT to the absolute PTXBench checkout path}
    environment:
      PTXBENCH_ROOT: ${PTXBENCH_HOST_ROOT}
      MINI_PTX_AGENT_ROOT: ${PTXBENCH_HOST_ROOT}/packages/mini-ptx-agent
      PTXBENCH_DATA_ROOT: ${PTXBENCH_HOST_ROOT}/data
      PROFILE_BASE_URL: http://localhost:${FIBSERVE_PORT:-10000}
    volumes:
      # Keep the same absolute checkout path inside and outside this container.
      # Child eval containers are launched through the host Docker socket.
      - ${PTXBENCH_HOST_ROOT}:${PTXBENCH_HOST_ROOT}
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      fibserve:
        condition: service_healthy
    init: true
