rtol: 1e-2
atol: 1e-2

definition_config:
  # dk and dg cancel to near-zero elements; FP32 rounding-order differences (e.g. FMA32
  # vs MUL32+ADD32 in the reverse state, TF32 vs FP16 in the dh output-path dot) move a
  # few of them past atol/rtol. Correct kernels miss up to dk 1,694 / dg 29 per random
  # draw; 0.9998 allows dk 3,355 / dg 52. dk ~0.9986 kernels compute the dh dot more
  # precisely than the reference's TF32 and still fail.
  gdn_bwd_qk8_v16_d128_k_last:
    per_output_required_matched_ratio:
      dk: 0.9998
      dg: 0.9998
  # final_state-only misses from reordered BF16 rounding of the recurrence: 2-59 of
  # 9,437,184 elements (one BF16 ulp, near-zero reference). 0.99999 allows 94 and
  # still rejects a buggy final_state at 0.999947. output stays at 1.0.
  kda_prefill_h96_d128_k_last:
    per_output_required_matched_ratio:
      final_state: 0.99999

# Fraction of total HBM for observed occupancy plus the next task reservation.
# Serve checks every task and verifies process/memory cleanup before replacement.
# Remaining headroom covers candidate scratch; arbitrary allocations can still OOM.
max_mem_ratio: 0.85
