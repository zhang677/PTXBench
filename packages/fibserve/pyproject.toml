[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fibserve"
version = "0.1.0"
description = "PTXBench GPU compilation, profiling, and evaluation service"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = {text = "Apache-2.0"}
authors = [
  {name = "PTXBench contributors"},
  {name = "FlashInfer contributors"},
]
dependencies = [
  "apache-tvm-ffi>=0.1.2",
  "docstring-parser>=0.16",
  "filelock>=3.0",
  "flashinfer-python>=0.6.4",
  "nvidia-cudnn-frontend<1.22",
  "pydantic>=2.0.0",
  "pyyaml>=6.0",
  "safetensors>=0.5.0",
  "torch>=2.8.0",
]

[project.optional-dependencies]
dev = [
  "httpx",
  "pytest>=7.0.0",
  "pytest-asyncio",
  "setuptools",
]
serve = [
  "fastapi>=0.100.0",
  "uvicorn[standard]>=0.20.0",
]

[project.scripts]
fibserve = "flashinfer_bench.cli.main:cli"

[tool.setuptools.packages.find]
where = ["."]
include = ["flashinfer_bench*"]

[tool.setuptools.package-data]
"flashinfer_bench" = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-rA --durations=0"
markers = ["requires_torch_cuda: tests that require torch and CUDA available"]
log_cli = true
log_cli_level = "INFO"
