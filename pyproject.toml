[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ptxbench"
version = "0.1.0.dev0"
description = "Open-source PTX kernel agent and GPU benchmark service"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = {text = "Apache-2.0"}
dependencies = [
  "fibserve",
  "mini-ptx-agent",
]

[project.optional-dependencies]
training = [
  "mini-ptx-agent[training]",
]

[tool.uv.sources]
mini-ptx-agent = {workspace = true}
fibserve = {workspace = true}

[tool.uv.workspace]
members = [
  "packages/mini-ptx-agent",
  "packages/fibserve",
]

[tool.setuptools]
packages = []

[tool.pytest.ini_options]
testpaths = ["tests", "packages/mini-ptx-agent/tests"]

[tool.ruff]
target-version = "py312"
line-length = 120
